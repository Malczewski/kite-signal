name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:services

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        working-directory: infra/envs/prod
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"

      - name: terraform plan
        working-directory: infra/envs/prod
        run: terraform plan -input=false

      - name: terraform apply
        working-directory: infra/envs/prod
        run: terraform apply -auto-approve -input=false

      - name: Smoke test hello lambda
        run: |
          aws lambda invoke --function-name kite-signal-hello \
            --cli-binary-format raw-in-base64-out --payload '{}' /tmp/hello-out.json
          cat /tmp/hello-out.json
          grep -q "Terraform + Lambda" /tmp/hello-out.json
